[project]
name = "q2jepa"
version = "0.1.0"
description = "Q2-JEPA: dual-quantum visual world model (HQViT + Born-prior JEPA) on CUDA-Q"
readme = "README.md"
authors = [
    { name = "Paul Hondola", email = "paulhondola@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cuda-quantum-cu13==0.16.0",
    "hydra-core>=1.4.0rc3,<1.5",
    "numpy>=1.26",
    "torch>=2.5",
    "torchvision>=0.20",
    "wandb>=0.18",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
