# @package _global_
# Phase-2 F5 tuning schedule s3: higher, 10x drop. Fixed before any sweep run; every encoder gets s1-s3, one seed, dev split.
# Usage: python -m q2jepa.train +experiment=phase2 +tune=s3 encoder=<cnn|vit|hqvit> seed=0
trainer:
  lr_enc: 1e-3
  lr_enc_later: 1e-4
eval:
  split: dev
